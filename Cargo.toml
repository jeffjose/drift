[package]
name = "glide"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Glide on Linux: a fast, native screen recorder and editor for polished product videos"
default-run = "glide"

[lib]
name = "glide"
path = "src/lib.rs"

[[bin]]
name = "glide"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"

egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
wgpu = "30"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
gif = "0.14"
color_quant = "1.1"
ab_glyph = "0.2"
cpal = "0.18"

whisper-rs = "0.16"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
x11rb = { version = "0.14", features = ["shm", "randr", "shape", "xfixes", "xinput"] }

[build-dependencies]
vergen-gitcl = "10.0.3"

[profile.release]
debug = 1
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
